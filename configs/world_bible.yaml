# =============================================================================
# world_bible.yaml — 世界观 / 设定模板（脱敏，规格 §7.10）
# =============================================================================
# 本文件是提交 Git 的【模板】：仅含虚构示例条目（サンプル~ / 示例~），
# 不得写入真实小说设定。
# 真实世界观数据存放于 workspace/configs/world_bible.yaml（已 gitignore）。
#
# 字段说明（schema: schemas/world_bible.schema.json）：
#   entry_id            条目 ID（唯一）
#   name                条目原文名（必填）
#   target_name         译名
#   category            分类（14 枚举之一，见下方对照表）
#   summary             摘要
#   details             详细说明（可为 null）
#   related_terms       关联术语（glossary source_term）列表
#   first_seen_chapter  首次出现章节号（>=1，可为 null）
#   notes               人工备注（可为 null）
#   created_at / updated_at  时间戳（ISO 8601）
#
# categories 14 分类枚举（规格 §7.10）：
#   faction             阵营
#   country             国家
#   region              地区
#   magic_system        魔法体系
#   level_system        等级体系
#   skill_system        技能体系
#   currency            货币
#   religion            宗教
#   race                种族
#   organization        组织
#   game_system         游戏系统
#   quest_system        任务系统
#   achievement_system  成就系统
#   other               其他设定
#
# 用途（规格 §7.10）：翻译一致性 / 校对一致性 / 小说生成资产沉淀 / 游戏设定资产沉淀。
# =============================================================================

schema_version: 1

meta:
  project: sample
  description: "世界观脱敏模板——仅虚构示例，真实数据在 workspace/configs/"

entries:
  - entry_id: wb-0001
    name: "サンプル王国"
    target_name: "示例王国"
    category: country
    summary: "虚构示例条目：展示国家类设定的字段用法"
    details: "大陆西侧的虚构王国，仅用于模板演示。"
    related_terms:
      - "サンプル王国"
    first_seen_chapter: 1
    notes: "模板示例，迁移真实数据时删除"
    created_at: "2026-06-11T00:00:00Z"
    updated_at: "2026-06-11T00:00:00Z"

  - entry_id: wb-0002
    name: "サンプル魔法体系"
    target_name: "示例魔法体系"
    category: magic_system
    summary: "虚构示例条目：展示魔法体系类设定；details 可为 null"
    details: null
    related_terms: []
    first_seen_chapter: null
    notes: null
    created_at: "2026-06-11T00:00:00Z"
    updated_at: "2026-06-11T00:00:00Z"
