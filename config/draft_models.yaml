# Draft translation model policy (candidate vs production primary).
# Do not commit API keys. Enable Nemotron only after model_ab_test passes.

schema_version: 1

models:
  draft_translation_primary:
    provider: model_router
    profile: draft_translation
    model: deepseek/deepseek-v4-pro
    enabled: true
    role: draft_translation_primary
    notes: "Current production primary after T-001/T-002 baseline."

  draft_translation_fallback:
    provider: model_router
    profile: draft_translation
    model: deepseek/deepseek-v4-pro
    enabled: true
    role: draft_translation_fallback
    notes: "Always keep DeepSeek as fallback."

  draft_translation_candidate:
    provider: model_router
    profile: draft_translation_nemotron_candidate
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    enabled: false
    role: draft_translation_candidate
    notes: >
      A/B 2026-06-07: 质量门槛通过，但 avg_latency_ms ~195000 vs DeepSeek ~8000；
      用户决定不切换生产模型，保持 disabled。

switching_rules:
  - Do not mix models mid-run without per-segment metadata.
  - Latency must be acceptable for 20-chapter rounds (reject if >> baseline).
  - Production primary remains deepseek/deepseek-v4-pro (user decision 2026-06-07).
  - Fallback must remain deepseek/deepseek-v4-pro.
