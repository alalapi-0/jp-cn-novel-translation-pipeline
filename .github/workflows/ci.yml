# Round 55 — deterministic tooling on every PR/push; UI tests optional (no API keys required).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run Playwright UI tests (npm run test:ui)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  REAL_API_TESTS_ENABLED: "false"

jobs:
  tooling:
    name: check:tooling
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-venv
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run tooling checks
        run: npm run check:tooling -- --surface codex

      - name: Upload gate result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result
          path: reports/gate_result.json
          if-no-files-found: warn

  ui:
    name: test:ui (optional)
    needs: tooling
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_ui_tests == true)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-venv
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Verify runner-provided Chrome
        run: |
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version

      - name: Playwright UI smoke
        run: |
          export LN_UI_CHROMIUM=/opt/google/chrome/chrome
          .venv/bin/python scripts/isolated_checks.py --entry ui
