mode: conservative_structured_repo_governance

final_state_policy:
  highest_project_goal_anchor: docs/product_final_state_spec.md
  execution_roadmap: docs/final_state_implementation_roadmap.md
  round_queue: docs/final_state_round_task_list.md
  conflict_rule: "Project implementation goals follow the final-state specification; portable protocol safety and secret rules remain mandatory."

allowed_actions:
  - read_governance_entry_files
  - grep_glob_targeted_search
  - create_update_governance_yaml
  - create_lightweight_validation_scripts
  - update_readme_and_docs_navigation
  - archive_with_migration_report
  - implement_in_active_business_round_only

restricted_actions:
  - large_directory_moves
  - business_refactors_during_governance_rounds
  - external_api_calls
  - dependency_additions_without_documentation
  - database_schema_changes

forbidden_actions:
  - read_or_print_env_secrets
  - commit_api_keys_or_credentials
  - start_real_translation_in_governance_round
  - generate_embeddings_in_governance_round
  - delete_historical_documents_without_report

network_policy:
  default: no_network_unless_required

git_finalization:
  mode: local_only
  automatic_stage: false
  automatic_commit: false
  automatic_push: false
  approved_round_local_completion_allowed: true
  commit_requires_explicit_current_turn_user_request: true
  push_requires_explicit_current_turn_user_authorization: true
  push_retry_requires_new_current_turn_user_authorization: true
  dirty_worktree:
    scoped_verified_task_changes_are_expected: true
    warning_is_blocking: false
    actual_fail_or_blocked_is_blocking: true
  authorization_sources:
    edit_or_build_request: false
    round_prompt: false
  never_commit_categories:
    - real_source_text
    - real_translation
    - workspace_runtime_artifacts
    - secrets

commit_policy:
  default: local_only_no_automatic_commit
  automatic_stage: false
  automatic_commit: false
  requires_explicit_current_turn_user_request: true
  round_prompt_can_authorize: false
  edit_or_build_request_can_authorize: false
  exact_path_staging_only: true
  verify_before_commit:
    - no_env_tracked
    - no_secrets_in_diff
    - no_real_source_text_in_diff
    - no_real_translation_in_diff
    - no_workspace_runtime_artifacts_in_diff

push_policy:
  default: local_only_no_automatic_push
  automatic_push: false
  requires_explicit_current_turn_user_authorization: true
  retry_requires_new_current_turn_user_authorization: true

workspace_file_baseline:
  root: workspace
  manifest: .agent_runtime/inspection_reports/workspace_file_baseline.json
  verifier: scripts/workspace_file_baseline.py
  algorithm: per_file_sha256
  workspace_sensitive_tools:
    verify_before: "python3 scripts/workspace_file_baseline.py verify --json"
    verify_after: "python3 scripts/workspace_file_baseline.py verify --json"
  drift_is_blocking: true
  verifier_error_is_blocking: true
  auto_rebaseline: false
  create_or_rebaseline_requires_explicit_current_turn_user_authorization: true
  full_agent_gate:
    live_worktree_execution_prohibited: true
    allowed_only_in_disposable_isolated_copy: true
    isolated_workspace_reports_runtime_outputs_must_not_write_back: true

translation_pipeline_rules:
  - do_not_mix_jp_to_cn_and_cn_to_jp_logic
  - do_not_call_real_api_in_governance_round
  - use_fake_provider_before_real_provider
  - real_batch_translation_only_in_translation_execution_round
  - real_api_is_allowed_in_explicitly_authorized_fs_dmr_rmr_rounds_with_cost_guard

automation_gate:
  entry: scripts/agent_gate.py
  report: docs/reports/agent_gate_report.md
  status: implemented_round_41
  live_worktree_execution: prohibited
  isolated_execution_only: disposable_copy
  isolated_outputs_write_back: false
