authoritative_governance:
  - path: governance/repo_protocol_standard.yaml
    role: cross_repo_standard
  - path: project.yaml
    role: project_identity
  - path: governance/round_state.yaml
    role: current_round_state
  - path: governance/agent_policy.yaml
    role: agent_permissions
  - path: governance/file_role_map.yaml
    role: file_role_registry
  - path: governance/model_policy.yaml
    role: model_policy
  - path: governance/data_policy.yaml
    role: data_policy
  - path: governance/novel_pipeline_contract.yaml
    role: translation_pipeline_contract

human_entry:
  - README.md
  - docs/index.md

agent_entry:
  - AGENTS.md
  - docs/product_final_state_spec.md
  - docs/next_agent_execution_protocol.md
  - docs/agent_operating_manual.md

roadmaps:
  - docs/final_state_implementation_roadmap.md
  - docs/final_state_round_task_list.md
  - docs/roadmap_rounds_00_40.md
  - docs/roadmap_rounds_41_50_tooling_and_workbench.md

final_state_governance:
  - path: docs/product_final_state_spec.md
    role: highest_project_goal_anchor
  - path: docs/final_state_implementation_roadmap.md
    role: executable_final_state_roadmap
  - path: docs/final_state_round_task_list.md
    role: ordered_round_queue_and_status
  - path: docs/phase_acceptance_criteria.md
    role: phase_gates
  - path: docs/definition_of_done.md
    role: done_contract
  - path: docs/non_goals_and_guardrails.md
    role: scope_and_safety_guardrails
  - path: docs/next_agent_execution_protocol.md
    role: standard_round_execution_protocol

tooling_docs:
  - docs/agent_tooling_strategy.md
  - docs/mcp_playwright_setup_plan.md
  - docs/agent_gate_and_protocol_check.md
  - docs/repo_protocol_alignment.md

alignment_and_audit:
  - docs/governance_round_02_audit.md
  - docs/repo_protocol_alignment.md
  - docs/current_repository_audit.md

secret_files:
  - .env
  - "*.pem"
  - "*.key"

ignored_content_directories:
  - input_jp/
  - input_cn/
  - output_cn/translated/
  - output_cn/bilingual/
  - output_cn/review/
  - output_jp/translated/
  - output_jp/bilingual/
  - output_jp/review/
  - notes/*.md
  - workspace/embeddings/
  - workspace/vector_store/

legacy:
  - path: docs/archive/legacy_roadmaps/translation_pipeline_governance_round.yaml
    role: historical_round_state
    treat_as_authority: false

quality_review_round_49:
  - path: data/schemas/review_issue.schema.json
    role: review_issue_schema
  - path: data/examples/review_issue_report.example.json
    role: review_issue_fixture_report
  - path: scripts/run_quality_review.py
    role: quality_review_cli
  - path: src/quality_review/
    role: quality_review_library
  - path: frontend/issues.html
    role: workbench_issue_dashboard
  - path: frontend/assets/review-issue-report.json
    role: workbench_issue_data
  - path: docs/quality_review_workbench_wireup.md
    role: workbench_wireup_doc
  - path: docs/round_50_e2e_acceptance_checklist.md
    role: round_50_e2e_checklist

generated_future:
  - path: governance/repo_inventory.generated.json
    role: generated_inventory
    status: not_yet_created
