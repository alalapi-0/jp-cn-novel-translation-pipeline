<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>导出中心 · 翻译工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="banner" id="mode-banner">加载配置…</div>
    <header>
      <h1>Export Center</h1>
      <nav>
        <a href="/index.html">项目首页</a>
        <a href="/issues.html">质量 Issue</a>
        <a href="/review.html">对照审核</a>
        <a href="/export.html">导出中心</a>
      </nav>
    </header>
    <main>
      <div class="card">
        <h2>导出状态</h2>
        <p class="meta">
          中文译文目录：<code id="export-zh-dir">—</code>（<strong id="export-zh-count">0</strong> 个 .md）
        </p>
        <p class="meta">
          双语目录：<code id="export-bi-dir">—</code>（<strong id="export-bi-count">0</strong> 个 .md）
        </p>
        <ul id="export-file-list" class="meta"></ul>
      </div>
      <div class="card">
        <h2>触发导出</h2>
        <p class="meta">优先从 <code>workspace/runs</code> 合并导出；若无 run，则回退为当前 manifest mock 导出。</p>
        <label>
          项目 ID（manifest 回退用）
          <input id="export-project-id" type="text" placeholder="demo-jp-cn" />
        </label>
        <label class="checkbox-row">
          <input id="export-overwrite" type="checkbox" checked />
          覆盖已有导出文件
        </label>
        <div class="actions">
          <button type="button" class="primary" id="export-run-btn">执行导出</button>
          <button type="button" id="export-refresh-btn">刷新状态</button>
        </div>
        <pre id="export-result"></pre>
      </div>
      <pre id="status-log"></pre>
    </main>
    <script src="/assets/config.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
