<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>对照审核 · 翻译工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="banner" id="mode-banner">加载配置…</div>
    <header>
      <h1>Side-by-side Translation Review</h1>
      <nav>
        <a href="/index.html">项目首页</a>
        <a href="/issues.html">质量 Issue</a>
        <a href="/review.html">对照审核</a>
        <a href="/export.html">导出中心</a>
      </nav>
    </header>
    <main>
      <div class="card">
        <h2>审核控制台</h2>
        <p class="meta">
          当前项目：<strong id="active-project-label">—</strong>
        </p>
        <p class="meta">
          <label for="project-switcher-search">搜索项目</label>
          <input id="project-switcher-search" type="search" placeholder="输入名称或 ID 筛选…" />
        </p>
        <p class="meta">
          <label for="project-switcher">切换项目</label>
          <select id="project-switcher"></select>
        </p>
        <p class="meta checkbox-row">
          <label>
            <input id="show-test-projects" type="checkbox" />
            显示测试/历史项目
          </label>
        </p>
        <p class="meta">
          API 模式：<strong id="api-mode-label">—</strong> · AUTO_APPROVE：
          <strong id="auto-approve-label">—</strong>
        </p>
        <pre id="status-log"></pre>
      </div>
      <div id="review-root"></div>
    </main>
    <script src="/assets/config.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
