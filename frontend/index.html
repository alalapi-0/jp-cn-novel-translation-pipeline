<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>翻译工作台 · 项目首页</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="banner" id="mode-banner">加载配置…</div>
    <header>
      <h1>翻译工作台</h1>
      <nav>
        <a href="/index.html">项目首页</a>
        <a href="/issues.html">质量 Issue</a>
        <a href="/review.html">对照审核</a>
        <a href="/export.html">导出中心</a>
      </nav>
    </header>
    <main>
      <div class="card" id="api-status-card">
        <h2>真实 API 状态</h2>
        <p class="meta">
          模式：<strong id="api-mode-status">加载中…</strong> · Key：
          <strong id="api-key-status">—</strong> · REAL_API_TESTS_ENABLED：
          <strong id="real-api-enabled-status">—</strong>
        </p>
        <p class="meta" id="api-smoke-summary">—</p>
        <p class="meta"><code id="api-config-hint">—</code></p>
      </div>

      <div class="card" id="quickstart-card">
        <h2>新用户快速体验（dry-run / fake）</h2>
        <p class="meta">无需 CLI：创建项目 → 粘贴样本文本 → 生成 mock 译文 → 进入审核。</p>
        <form id="quickstart-form" class="stack-form">
          <label>
            项目 ID
            <input id="qs-project-id" type="text" placeholder="quickstart-demo" required />
          </label>
          <label>
            项目名称
            <input id="qs-project-name" type="text" placeholder="我的试译项目" />
          </label>
          <label>
            方向
            <select id="qs-direction">
              <option value="JP_TO_CN">JP_TO_CN（日译中）</option>
              <option value="CN_TO_JP">CN_TO_JP（中译日）</option>
            </select>
          </label>
          <label>
            样本文本（段落以空行分隔）
            <textarea id="qs-sample-text" rows="5" placeholder="彼女は学校に行かなかった。&#10;&#10;空が裂けたようだ。"></textarea>
          </label>
          <div class="actions">
            <button type="submit" class="primary">创建并 dry-run 生成</button>
            <a id="qs-review-link" class="button-link" href="/review.html" hidden>进入对照审核 →</a>
          </div>
        </form>
        <p class="meta" id="quickstart-result"></p>
      </div>

      <div id="project-list"></div>
      <div class="card">
        <h2>运行配置</h2>
        <p class="meta" id="config-summary"></p>
        <p class="meta">数据源：<strong id="data-source-label">加载中…</strong></p>
        <pre id="status-log"></pre>
      </div>
    </main>
    <script src="/assets/config.js"></script>
    <script src="/assets/app.js"></script>
  </body>
</html>
