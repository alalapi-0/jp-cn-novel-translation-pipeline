project:
  name: light_novel
  type: ai_novel_translation_pipeline
  summary: "中日文小说互译生产流水线治理与实现仓库"
  long_term_goal: "交付 docs/product_final_state_spec.md 定义的本地 Web UI 驱动长篇小说中日互译生产系统"
  owner: user
  primary_language: zh-CN
  output_language: bilingual_zh_ja
  stage: final_ready_singleton_export_v2
  current_round_human: "2026-06-18 v2 governance: refinement/R-MR/production_candidate removed from mainline; singleton final translation ready"
  current_round_machine: governance_final_ready_v2_cleanup_20260618

repository:
  entry_points:
    human: README.md
    agent: AGENTS.md
    docs_navigation: docs/index.md
  authoritative_files:
    - docs/product_final_state_spec.md
    - docs/next_agent_execution_protocol.md
    - docs/final_state_implementation_roadmap.md
    - docs/final_state_round_task_list.md
    - docs/translation_production_protocol.md
    - docs/translation_consistency_protocol.md
    - docs/phase_acceptance_criteria.md
    - docs/definition_of_done.md
    - docs/non_goals_and_guardrails.md
    - governance/repo_protocol_standard.yaml
    - project.yaml
    - governance/round_state.yaml

translation_pipeline:
  directions:
    - JP_TO_CN
    - CN_TO_JP
  shared_core: shared/
  direction_modules:
    jp_to_cn: directions/jp_to_cn/
    cn_to_jp: directions/cn_to_jp/

protocol_standard:
  path: governance/repo_protocol_standard.yaml
  version: "0.3.0"
  source_repo: novel-continuation-agent
  synced_at: "2026-06-01"
  truncated_backup: docs/archive/governance/repo_protocol_standard_truncated_backup.yaml

protocol_standard_sync_required: true

git_finalization_policy:
  mode: required_verified_remote_delivery
  unit: git_safe_cohort
  max_cohorts_per_round: 1
  standing_delivery_authority: standing_git_safe_cohort_policy_v1
  auto_finalize_approved_git_safe_cohort: true
  target:
    remote: origin
    branch: codex/light-novel-governance-closure-20260813
    default_branch: main
    remote_must_preexist: true
    branch_must_preexist: true
    fetch_and_push_url_must_match: true
    fresh_remote_head_must_match_default_branch: true
  authorization_sources:
    standing_repository_policy: true
    edit_or_build_request: false
    round_prompt: false
  prerequisites:
    exact_hash_bound_plan: true
    registered_plan_sha256_required_at_execution: true
    approval_subject_sha256_required: true
    content_safety_review_required: true
    scoped_validation_required: true
    required_approvals_satisfied: true
    prior_remote_sha_must_match_base: true
  staging:
    exact_paths_only: true
    preexisting_index_must_be_empty: true
    broad_staging_forbidden: true
  delivery:
    commit_required: true
    push_required: true
    force_push_forbidden: true
    verify_remote_sha: true
  completion:
    approved_local_only_completion_allowed: false
    requires_remote_sha_match: true
    next_cohort_blocked_until_verified: true
  push_failure:
    preserve_local_commit: true
    mark_cohort_incomplete: true
    blind_retry_forbidden: true
    same_target_retry_requires_state_or_method_change: true
    retry_change_evidence_required: true
    retry_evidence_must_bind_plan: true
    retry_evidence_reuse_forbidden: true
  authority_expansion:
    remote_change_requires_new_user_authorization: true
    branch_change_requires_new_user_authorization: true
    effect_expansion_requires_new_user_authorization: true
  actual_fail_or_blocked_is_blocking: true
  never_commit_categories:
    - real_source_text
    - full_real_translation
    - workspace_runtime_artifacts
    - artifacts
    - secrets

workspace_file_baseline:
  root: workspace
  manifest: .agent_runtime/inspection_reports/workspace_file_baseline.json
  verifier: scripts/workspace_file_baseline.py
  algorithm: per_file_sha256
  workspace_sensitive_tools:
    verify_before: "python3 scripts/workspace_file_baseline.py verify --json"
    verify_after: "python3 scripts/workspace_file_baseline.py verify --json"
  drift_is_blocking: true
  verifier_error_is_blocking: true
  auto_rebaseline: false
  create_or_rebaseline_requires_explicit_current_turn_user_authorization: true
  full_agent_gate:
    live_worktree_execution_prohibited: true
    allowed_only_in_disposable_isolated_copy: true
    isolated_workspace_reports_runtime_outputs_must_not_write_back: true

asset_extraction:
  enabled: false
  default_mode: rule-based
  allow_real_api: false
  max_chapters: 5
  max_segments: 50
  max_requests: 5
  write_to_public_asset_library: false

project_overrides:
  - field: authority.priority_order
    standard_expectation: "Portable protocol is first for cross-repository governance"
    override_value: "docs/product_final_state_spec.md is the highest project-goal anchor; protocol safety and secret-handling rules remain non-negotiable"
    reason: "The user designated the final-state specification as the repository's product destination and anti-drift authority"
    owner: user
    review_trigger: "Only when the user explicitly revises the final-state specification"

  - field: round_protocol.current_round_source
    standard_expectation: governance/round_state.yaml
    override_value: "Legacy governance archived at docs/archive/legacy_roadmaps/translation_pipeline_governance_round.yaml"
    reason: "First governance round created round_state/ before full protocol adoption"
    owner: user
    review_trigger: "When legacy file is fully migrated or archived"

  - field: project_specific_extensions.current_reference_project.default_workflow
    standard_expectation: chinese_first_generation_and_review
    override_value: japanese_chinese_bidirectional_translation_pipeline
    reason: "This repo is a translation pipeline, not a Chinese generation pipeline"
    owner: user
    review_trigger: "When novel_pipeline_contract.yaml is updated"

  - field: agent_policy_standard.git_finalization
    standard_expectation: "Approved-round automatic stage, commit, and push"
    override_value: "Every approved Git-safe cohort must use the hash-bound finalizer to exact-stage, commit, push to the registered existing non-default branch, and verify the remote SHA before completion or the next cohort"
    reason: "The owner requires each review round's Git-safe results to reach GitHub instead of accumulating in the local worktree"
    owner: user
    review_trigger: "When the owner changes the registered remote, branch, never-commit boundary, or required remote-delivery workflow"

  - field: agent_policy_standard.automation_policy
    standard_expectation: "Run scripts/agent_gate.py before autonomous advancement"
    override_value: "Full agent_gate execution is prohibited in the real worktree; live advancement uses scoped targeted/read-only checks, and a full gate may run only in a disposable isolated copy with no output writeback"
    reason: "The full gate may write reports or invoke workspace-sensitive diagnostics"
    owner: user
    review_trigger: "Only when the user explicitly changes the project's live-tree isolation or mutation policy"

  - field: agent_reading_protocol.after_editing_checklist
    standard_expectation: "Run protocol checks and regenerate inventory after applicable edits"
    override_value: "Writing checks and inventory generation are never implicit post-edit validation; they run only when the current scoped task explicitly owns them, and workspace-sensitive tools require baseline verification before and after"
    reason: "Routine live-tree validation must remain targeted and read-only"
    owner: user
    review_trigger: "Only when the user explicitly changes the project's live-tree isolation or mutation policy"

  - field: portability_guide.validation_steps
    standard_expectation: "Run inventory, contract, and protocol scripts and review generated reports"
    override_value: "Use targeted/read-only validation in the real worktree; mutation-producing portability steps are opt-in scoped maintenance rather than routine gates"
    reason: "Portable checks must not silently mutate project inventory or reports"
    owner: user
    review_trigger: "Only when the user explicitly changes the project's live-tree isolation or mutation policy"

  - field: sync_requirements.drift_detection
    standard_expectation: "Regenerate governance/repo_inventory.generated.json after structural changes"
    override_value: "Detect drift read-only where possible; inventory regeneration is a separately scoped mutation and never an implicit validation side effect"
    reason: "Generated inventory changes require explicit task ownership and review"
    owner: user
    review_trigger: "Only when the user explicitly changes the project's live-tree isolation or mutation policy"

  - field: governance_files[path=governance/repo_inventory.generated.json].update_frequency
    standard_expectation: "Regenerate after structural changes or governance audits"
    override_value: "Regenerate only when the current task explicitly owns inventory refresh and all scoped preconditions are satisfied"
    reason: "Inventory refresh is a mutation, not a default validation step"
    owner: user
    review_trigger: "Only when the user explicitly changes the project's live-tree isolation or mutation policy"
