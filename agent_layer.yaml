version: 3
updated_at: "2026-08-13T01:51:15Z"

repo:
  name: light_novel
  type: ai_novel_translation_pipeline
  primary_language: python
  package_manager: npm_and_pip
  entrypoints:
    - README.md
    - AGENTS.md
    - npm run dev:frontend
    - npm run check:tooling
  core_user_flows:
    - workbench_review_and_quality_check
    - translation_pipeline_dry_run
    - multi_project_manifest_switch
    - real_api_smoke_gated

docs:
  read_first:
    - AGENTS.md
    - docs/product_final_state_spec.md
    - docs/next_agent_execution_protocol.md
    - docs/final_state_implementation_roadmap.md
    - docs/final_state_round_task_list.md
    - docs/translation_production_protocol.md
    - docs/translation_consistency_protocol.md
    - agent_tools.yaml
    - agent_layer.yaml
    - docs/TOOL_USAGE_POLICY.md
    - docs/AGENT_RUNBOOK.md
    - reports/current-cohort-report.json
  research_notes: docs/RESEARCH_NOTES.md
  tool_inventory: docs/TOOL_INVENTORY.md
  search_policy: docs/SEARCH_POLICY.md
  codex_usage: docs/CODEX_USAGE.md

commands:
  install:
    - npm ci
    - python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
  dev:
    - npm run dev:frontend
  build: []
  lint:
    - npm run check:tooling
  test:
    - npm run test:py
    - npm run test:ui
  e2e:
    - npm run test:ui
    - python3 scripts/run_round_50_e2e_trial.py
  typecheck: []
  format_check: []
  dry_run:
    - python3 scripts/run_real_api_smoke.py
    - python3 scripts/run_openrouter_smoke.py --dry-run
  live_targeted_validation:
    - npm run check:tooling
  isolated_full_gate:
    execution_context: disposable_copy_only
    live_worktree_prohibited: true
    output_writeback: false
    commands:
      - python3 scripts/agent_gate.py --json
  user_view_test:
    - python3 scripts/user_view_test.py
    - python3 scripts/run_browser_inspection.py

paths:
  docs: docs
  reports: reports
  scripts: scripts
  tests: tests
  artifacts: artifacts
  fixtures: data/examples
  schemas: schemas

agent_policy:
  primary_agent_surface: cursor
  secondary_agent_surface: codex
  default_mode: safe
  allow_real_api: false
  allow_real_publish: false
  require_web_search_for_fresh_info: true
  require_tool_probe_before_tool_plan: true
  require_tool_usage_log: true
  require_report: true
  require_verified_scoped_candidate_before_commit: true
  live_full_gate_prohibited: true
  git_finalization_mode: required_verified_remote_delivery
  git_safe_cohort_finalizer: scripts/git_safe_cohort_finalizer.py
  auto_finalize_approved_git_safe_cohort: true
  registered_remote: origin
  registered_branch: codex/light-novel-governance-closure-20260813
  default_branch_push_forbidden: true
  exact_hash_bound_plan_required: true
  registered_plan_sha256_required_at_execution: true
  approval_subject_sha256_required: true
  content_safety_review_required: true
  exact_path_staging_only: true
  remote_sha_match_required_for_completion: true
  next_cohort_blocked_until_remote_verified: true
  blind_push_retry_forbidden: true
  same_target_retry_requires_state_or_method_change: true
  retry_change_evidence_required: true
  retry_evidence_reuse_forbidden: true
  target_change_requires_new_user_authorization: true
  git_authorization_sources:
    standing_repository_policy: true
    edit_or_build_request: false
    round_prompt: false
  max_scope_per_round: small
  prefer_incremental_changes: true
  real_api_round_override: "Allowed only when the selected v2 task explicitly permits it and cost/pause/lock/orphan guards pass; Agent quota translation must use the same structured output contract"

severity:
  p0: "data loss, secret leak, app cannot start, build completely broken, destructive behavior, real publish/API misfire"
  p1: "core user flow broken, main feature unusable, core tests failing, user cannot complete main task"
  p2: "non-critical feature issue, UI/UX defect, partial degradation"
  p3: "docs, refactor, polish, non-blocking improvement"

round:
  report_schema: schemas/agent_round_report.schema.json
  current_cohort_report: reports/current-cohort-report.json
  audit_log: reports/agent_audit_log.jsonl
  roadmap: docs/final_state_implementation_roadmap.md
  historical_agent_layer_roadmap: docs/AGENT_ROADMAP.md
  tool_probe_report: reports/tool_probe_report.json
  gate_result: reports/gate_result.json

final_state:
  anchor: docs/product_final_state_spec.md
  roadmap: docs/final_state_implementation_roadmap.md
  task_list: docs/final_state_round_task_list.md
  acceptance: docs/phase_acceptance_criteria.md
  definition_of_done: docs/definition_of_done.md
  guardrails: docs/non_goals_and_guardrails.md
  execution_protocol: docs/next_agent_execution_protocol.md
  production_protocol: docs/translation_production_protocol.md
  consistency_protocol: docs/translation_consistency_protocol.md
  current_phase: final_ready_singleton_export_v2
  next_micro_round: null
  current_final_translation: output_cn/translated/full_volume_cn.md
  singleton_check: reports/final_translation_singleton_check.json

legacy_governance:
  note: "Existing governance/*.yaml and docs/roadmap_rounds_* remain authoritative for pipeline rounds"
  merge_strategy: "Agent Layer 2.0 extends, does not replace, Round 41+ tooling docs"
